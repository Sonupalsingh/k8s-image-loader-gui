# Local OCI image registry (CNCF Distribution). Nodes pull from it at localhost:30500,
# the dashboard pushes to it at image-registry.k8s-image-loader.svc:5000.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-registry
  namespace: k8s-image-loader
  labels:
    app.kubernetes.io/name: k8s-image-loader
    app.kubernetes.io/component: registry
spec:
  replicas: 1                 # filesystem storage: exactly one replica
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-image-loader
      app.kubernetes.io/component: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-image-loader
        app.kubernetes.io/component: registry
    spec:
      priorityClassName: system-cluster-critical   # nodes depend on it to start pods
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: registry
          image: docker.io/library/registry:2.8.3
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 5000 }
          env:
            - { name: REGISTRY_HTTP_ADDR, value: ":5000" }
            - { name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY, value: /var/lib/registry }
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
            - { name: REGISTRY_LOG_LEVEL, value: info }
            - { name: OTEL_TRACES_EXPORTER, value: none }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /v2/, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v2/, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: image-registry
  namespace: k8s-image-loader
  labels:
    app.kubernetes.io/component: registry
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: k8s-image-loader
    app.kubernetes.io/component: registry
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500          # every node reaches the registry at localhost:30500
